# Product site: publishes site/ to GitHub Pages on pushes to main / master that touch it.
# Pages needs a public repository (or a paid plan for private ones); until then this job may fail — harmless.
name: Pages

on:
  push:
    branches: [main, master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the public files only (no notes)
        run: |
          mkdir -p _site
          rsync -a --exclude '.*' --exclude '*.md' site/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
