schema_version = "1.0.0"

# Template: <Blender 5.2>/5.2/scripts/templates_toml/blender_manifest.toml
id = "allset"
version = "0.11.0"
name = "Maya Workflow Kit"
tagline = "The whole Maya workflow in Blender, in one install"
maintainer = "5hyuns <555hyuns@gmail.com>"
type = "add-on"
# Extensions platform tags ($S\modules\_bpy_internal\extensions\tags.py).
# "User Interface" only: the moderator asked to remove every other tag (store review, GitHub #40).
# No `website` until there is a public page; no `platforms`: pure Python, every OS.
tags = ["User Interface"]

# 5.0 since 0.7.0: 0.6.2 is the last version for Blender 4.5.
blender_version_min = "5.0.0"
# Supported: Blender 5.2 LTS; other versions are not tested (5.0 / 5.1 still install). Exclusive maximum: a
# Blender after 5.2 gets a clear "not compatible" until it is tested.
blender_version_max = "5.3.0"

# Code GPL-3.0-or-later; the kit-made images and data files (welcome PNGs, the Maya layout startup.blend)
# CC0-1.0 — extensions.blender.org terms 1.2, ASSETS_LICENSE.txt.
license = [
  "SPDX:GPL-3.0-or-later",
  "SPDX:CC0-1.0",
]
copyright = [
  "2026 5hyuns",
]

[permissions]
# Writes: the extension user folder (your shelves, the translation template) and the Maya project folders the
# file dialogs open in
# Nothing outside them: no layout template, no
# preference snapshot, no theme backup.
files = "Your shelves, translation template and Maya project folders"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".ruff_cache/",
  "/.git/",
  "/*.zip",
  "*.blend1",
]
